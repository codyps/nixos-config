experimental-features = nix-command flakes
build-users-group = nixbld
# An unprivileged Docker container cannot create Nix's nested mount sandbox.
sandbox = false
max-jobs = 4
cores = 2
substituters = https://cache.nixos.org/

# Keep aligned with flake.nix nixConfig, also used by modules/nix-cache.nix.
extra-substituters = https://nix-community.cachix.org https://codyps.cachix.org
