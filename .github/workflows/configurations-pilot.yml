name: Build and cache flake outputs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish successful closures to Cachix (master only)
        type: boolean
        default: true

  workflow_call:
    inputs:
      ref:
        description: Exact commit produced by the flake updater
        required: true
        type: string
      publish:
        description: Publish successful closures on master
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: flake-cache-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      configurations: ${{ steps.matrix.outputs.configurations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Test pilot reporting
        run: python3 scripts/test-configuration-pilot.py
      - name: Test Caddy hash updater
        run: python3 scripts/test-update-caddy-hashes.py
      - name: Check persistent cache settings for every configuration
        run: |
          nix eval --accept-flake-config --no-update-lock-file --impure --json \
            --expr 'let flake = builtins.getFlake ("path:" + toString ./.); in import (flake.outPath + "/scripts/check-nix-caches.nix") flake'
      - name: Discover configuration and package targets
        id: matrix
        run: |
          nix eval --accept-flake-config --no-update-lock-file --impure --json \
            --expr 'let flake = builtins.getFlake ("path:" + toString ./.); in import (flake.outPath + "/scripts/configuration-matrix.nix") flake' > matrix.json
          jq -e '.include | length > 0' matrix.json
          echo "configurations=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"
          {
            echo '### Flake cache targets'
            echo "Revision: $(git rev-parse HEAD)"
            echo '```json'
            jq . matrix.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: matrix
    name: ${{ matrix.kind }} / ${{ matrix.name }} (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.matrix.outputs.configurations) }}
    env:
      CACHE_REVISION: ${{ inputs.ref || github.sha }}
      CONFIGURATION_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Check publishing credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && (inputs.publish || (github.event_name == 'push' && inputs.ref == ''))
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_CACHE" || { echo 'Set the CACHIX_CACHE repository variable.'; exit 1; }
          test -n "$CACHIX_AUTH_TOKEN" || { echo 'Set the CACHIX_AUTH_TOKEN repository secret.'; exit 1; }

      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true

      - name: Build target and measure resources
        run: python3 scripts/configuration-pilot.py "$CONFIGURATION_TARGET"

      - name: Publish target runtime closure
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && (inputs.publish || (github.event_name == 'push' && inputs.ref == ''))
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -o pipefail
          cachix push "$CACHIX_CACHE" ./result 2>&1 | tee pilot/publish.log

      - name: Retain pilot measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: configuration-pilot-${{ strategy.job-index }}
          path: pilot/
          if-no-files-found: warn
          retention-days: 14
