[package]
name = "actions-vm-scaler"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "GitHub Actions scale sets backed by disposable QEMU VMs"

[dependencies]
anyhow = "1"
fs2 = "0.4"
jsonwebtoken = "10"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "io-util", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
strip = true
lto = "thin"
