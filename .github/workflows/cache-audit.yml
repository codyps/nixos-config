name: Remove identified production cache sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remove the two verified public plaintext source snapshots
        env:
          TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          # These exact snapshots were verified to contain the production inventory.
          hashes = ['1mavidmkv2yb3ba0qh0glha6fy262ziq', 'q1bxzk43kxnhri8x3my6s19pi08ak1z3']
          statuses = {}
          for h in hashes:
              request = urllib.request.Request('https://app.cachix.org/api/v1/cache/codyps/' + h + '.narinfo',
                  method='DELETE', headers={'Authorization': 'Bearer ' + os.environ['TOKEN']})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      statuses[h] = response.status
              except urllib.error.HTTPError as error:
                  statuses[h] = error.code
          print(json.dumps(statuses))
          assert all(x in (200, 204, 404) for x in statuses.values()), 'Removal requires a credential with permission to delete cache entries'
