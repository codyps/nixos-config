[package]
name = "nix-dynamic-machines"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Build a Nix remote-machines file from reachable candidates"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "signal", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
