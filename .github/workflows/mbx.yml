name: Build and cache mbx

on:
  push:
    branches: [master]
    paths:
      - flake.nix
      - flake.lock
      - nixpkgs/overlays/**
      - .github/workflows/mbx.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nixpkgs/overlays/**
      - .github/workflows/mbx.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build after the automated flake update
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mbx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mbx (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-darwin
            runner: macos-15-intel
          - system: aarch64-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Check publishing credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_CACHE" || { echo 'Set the CACHIX_CACHE repository variable.'; exit 1; }
          test -n "$CACHIX_AUTH_TOKEN" || { echo 'Set the CACHIX_AUTH_TOKEN repository secret.'; exit 1; }

      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true

      - name: Build and test mbx
        run: nix build --accept-flake-config --no-update-lock-file --print-build-logs --out-link result '.#packages.${{ matrix.system }}.mbx'

      - name: Publish mbx and its runtime closure
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: cachix push "$CACHIX_CACHE" ./result
